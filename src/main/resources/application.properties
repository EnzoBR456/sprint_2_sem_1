spring.application.name=backend
spring.jpa.open-in-view=false
spring.jackson.serialization.fail-on-empty-beans=false

# CORREÇÃO: Use as mesmas credenciais do docker-compose
spring.datasource.url=jdbc:mysql://localhost:3306/readings_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=user
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.backend=TRACE

# JWT Secret
jwt.secret=minhaChaveSecretaSuperSeguraParaSprint4Hete2024

# Logs DETALHADOS do Spring Security
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter=DEBUG